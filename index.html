<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OFFICIAL UNO PRO 🎴 | J.LSRY63</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

  :root {
    --primary: #00f0ff;
    --primary-glow: rgba(0, 240, 255, 0.4);
    --secondary: #ff007f;
    --secondary-glow: rgba(255, 0, 127, 0.4);
    --yellow: #ffe600;
    --bg: #05070f;
    --panel-bg: rgba(12, 16, 32, 0.88);
    --panel-border: rgba(0, 240, 255, 0.3);
    --card-w: 70px;
    --card-h: 102px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Rajdhani', sans-serif; }

  body {
    min-height: 100vh;
    background-color: var(--bg);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 10px;
  }

  #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* LOBBY / PANEL AVEC ANIMATION SWIPE */
  .cyber-panel {
    position: relative; z-index: 10; width: 95vw; max-width: 880px;
    background: var(--panel-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--panel-border); border-radius: 24px; padding: 28px 24px;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .title-container { text-align: center; margin-bottom: 20px; }
  .cyber-title {
    font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, var(--primary) 50%, var(--secondary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .cyber-subtitle { color: #8a99ad; font-size: 0.95rem; font-weight: 600; margin-top: 4px; }

  .cyber-input {
    width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(0, 240, 255, 0.3);
    background: rgba(5, 7, 15, 0.8); color: var(--primary); font-family: 'Orbitron', sans-serif;
    font-size: 1rem; text-align: center; outline: none; margin-bottom: 12px; transition: 0.3s;
  }
  .cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

  .cyber-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--primary), #0072ff); color: #000;
    font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 900;
    letter-spacing: 1px; cursor: pointer; transition: all 0.25s ease;
    box-shadow: 0 0 20px var(--primary-glow); margin-top: 8px;
  }
  .cyber-btn.pink { background: linear-gradient(135deg, var(--secondary), #ff0040); color: #fff; box-shadow: 0 0 20px var(--secondary-glow); }
  .cyber-btn.secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border); color: #fff; box-shadow: none; }
  .cyber-btn:active { transform: scale(0.97); }

  /* SECTION ANIMÉE REJOINDRE / CRÉER */
  .animated-box {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .animated-box.open {
    max-height: 200px; opacity: 1; margin-top: 16px;
  }

  /* PLATEAU DE JEU UNO */
  #gameArena {
    position: relative; width: 100vw; height: 100vh; max-width: 920px; max-height: 600px;
    background: radial-gradient(circle, #1a233a 0%, #0a0d18 80%);
    border: 2px solid var(--primary); border-radius: 36px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }

  .room-badge {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.6); border: 1px solid var(--primary);
    padding: 4px 16px; border-radius: 20px; font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem; color: var(--primary);
  }

  .cyber-avatar { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 10; }
  .avatar-ring {
    width: 55px; height: 55px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2);
    background: rgba(12, 16, 32, 0.8); display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
  }
  .avatar-label {
    font-size: 0.75rem; font-weight: 700; margin-top: 4px;
    background: rgba(0, 0, 0, 0.7); padding: 2px 8px; border-radius: 10px;
  }
  .cyber-avatar.active .avatar-ring { border-color: var(--yellow); box-shadow: 0 0 20px var(--yellow); animation: pulse 1s infinite alternate; }

  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  .pos-bottom { bottom: 15px; }
  .pos-top { top: 15px; }
  .pos-left { left: 15px; }
  .pos-right { right: 15px; }

  .table-center { display: flex; gap: 20px; align-items: center; justify-content: center; z-index: 5; }

  .uno-card {
    width: var(--card-w); height: var(--card-h); border-radius: 10px;
    border: 2px solid #fff; background: #0c1020; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; transition: 0.25s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); text-align: center;
  }
  .uno-card.blue { background: linear-gradient(135deg, #007aff, #003399); }
  .uno-card.green { background: linear-gradient(135deg, #34c759, #006622); }
  .uno-card.red { background: linear-gradient(135deg, #ff3b30, #990000); }
  .uno-card.yellow { background: linear-gradient(135deg, #ffcc00, #997700); color: #000; }
  .uno-card.wild { background: linear-gradient(135deg, #ff007f, #00f0ff, #ffe600, #34c759); }
  .uno-card.back { background: repeating-linear-gradient(45deg, var(--secondary), var(--secondary) 10px, #000 10px, #000 20px); }
  .uno-card:hover { transform: translateY(-8px); }

  .player-hand {
    position: absolute; bottom: 75px; display: flex;
    max-width: 88%; overflow-x: auto; padding: 10px; z-index: 20;
  }
  .player-hand .uno-card { margin-left: -20px; }
  .player-hand .uno-card:first-child { margin-left: 0; }

  .uno-trigger {
    position: absolute; bottom: 20px; right: 20px; width: 65px; height: 65px; border-radius: 50%;
    background: linear-gradient(135deg, var(--secondary), #ff0040); border: 2px solid #fff;
    color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; z-index: 30;
    box-shadow: 0 0 20px var(--secondary-glow);
  }

  .color-picker {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95); padding: 18px; border-radius: 20px; border: 2px solid var(--primary);
    display: grid; grid-template-columns: repeat(2, 65px); gap: 12px; z-index: 50;
    box-shadow: 0 0 30px var(--primary-glow);
  }
  .color-btn { width: 65px; height: 65px; border-radius: 14px; cursor: pointer; border: 2px solid #fff; }

  .hidden { display: none !important; }

  .cyber-footer {
    position: relative; z-index: 10; margin-top: 16px; font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    text-align: center; color: #fff; background: rgba(0, 240, 255, 0.08); padding: 8px 20px;
    border-radius: 30px; border: 1px solid var(--primary-glow);
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- LOBBY PRINCIPAL -->
<div class="cyber-panel" id="lobbyPanel">
  <div class="title-container">
    <div class="cyber-title">OFFICIAL UNO ONLINE</div>
    <div class="cyber-subtitle">Mode Officiel • Attaque +2 & +4 Instantanée • 1 à 4 Joueurs</div>
  </div>

  <input type="text" class="cyber-input" id="playerName" placeholder="TON PSEUDO" maxlength="12" value="Jad" />

  <button class="cyber-btn" onclick="initRoom()">➕ CRÉER UNE TABLE</button>
  <button class="cyber-btn secondary" style="margin-top:10px;" onclick="toggleJoinBox()">🔗 REJOINDRE UNE TABLE</button>

  <div class="animated-box" id="joinBox">
    <input type="text" class="cyber-input" id="roomInput" placeholder="CODE DE TABLE (EX: A7F3K2)" maxlength="6" />
    <button class="cyber-btn pink" onclick="connectRoom()">REJOINDRE LA PARTIE</button>
  </div>
</div>

<!-- PLATEAU UNO -->
<div id="gameArena" class="hidden">
  <div class="room-badge" id="badgeRoom">TABLE : ------</div>

  <div class="cyber-avatar pos-bottom" id="slot0"><div class="avatar-ring">🧙‍♂️</div><div class="avatar-label" id="lbl0">Toi</div></div>
  <div class="cyber-avatar pos-top" id="slot1"><div class="avatar-ring">🥷</div><div class="avatar-label" id="lbl1">En attente...</div></div>
  <div class="cyber-avatar pos-left" id="slot2"><div class="avatar-ring">🦸‍♂️</div><div class="avatar-label" id="lbl2">En attente...</div></div>
  <div class="cyber-avatar pos-right" id="slot3"><div class="avatar-ring">🤖</div><div class="avatar-label" id="lbl3">En attente...</div></div>

  <div class="table-center">
    <div class="uno-card back" onclick="drawUnoCard()" title="Piocher 1 carte"></div>
    <div class="uno-card red" id="tablePile">8</div>
  </div>

  <div class="player-hand" id="handBox"></div>
  <button class="uno-trigger" onclick="shoutUno()">UNO!</button>

  <div class="color-picker hidden" id="colorPicker">
    <div class="color-btn" style="background:#007aff" onclick="chooseColor('blue')"></div>
    <div class="color-btn" style="background:#34c759" onclick="chooseColor('green')"></div>
    <div class="color-btn" style="background:#ff3b30" onclick="chooseColor('red')"></div>
    <div class="color-btn" style="background:#ffcc00" onclick="chooseColor('yellow')"></div>
  </div>
</div>

<div class="cyber-footer">DÉVELOPPÉ PAR J.LSRY63</div>

<script>
/* CANVAS BACKGROUND PARTICULES */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let pts = [];

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resizeCanvas; resizeCanvas();

for(let i=0; i<50; i++) {
  pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8 });
}

function animCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
  pts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(animCanvas);
}
animCanvas();

/* FIREBASE CONFIGURATION */
const firebaseConfig = {
  apiKey: "AIzaSyC1MOyaEvL5PjjtHrbaPpRkZfIy_oXO2e8",
  authDomain: "jeu-entre-freres.firebaseapp.com",
  projectId: "jeu-entre-freres",
  storageBucket: "jeu-entre-freres.firebasestorage.app",
  messagingSenderId: "360129773422",
  appId: "1:360129773422:web:e8c7386b0dffd5d38acb7f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let myId = 'p_' + Math.random().toString(36).slice(2,8);
let currentRoom = null, unsub = null, pendingCard = null;

function toggleJoinBox() {
  document.getElementById('joinBox').classList.toggle('open');
}

/* DECK OFFICIEL 112 CARTES */
function buildOfficialDeck() {
  const colors = ['blue', 'green', 'red', 'yellow'];
  let deck = [];

  colors.forEach(c => {
    deck.push({ color: c, val: '0' });
    for(let i=1; i<=9; i++) {
      deck.push({ color: c, val: i.toString() }, { color: c, val: i.toString() });
    }
    deck.push({ color: c, val: '+2' }, { color: c, val: '+2' });
    deck.push({ color: c, val: '🔄' }, { color: c, val: '🔄' });
    deck.push({ color: c, val: '🚫' }, { color: c, val: '🚫' });
  });

  for(let i=0; i<4; i++) deck.push({ color: 'wild', val: '🌈 Wild' });
  for(let i=0; i<4; i++) deck.push({ color: 'wild', val: '🌈 +4' });

  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function initRoom() {
  const name = document.getElementById('playerName').value.trim() || 'Joueur 1';
  currentRoom = Math.random().toString(36).slice(2,8).toUpperCase();
  let deck = buildOfficialDeck();

  let initialHand = deck.splice(0, 7);
  let startCard = deck.pop();
  while(startCard.color === 'wild') {
    deck.unshift(startCard);
    startCard = deck.pop();
  }

  db.collection('rooms').doc(currentRoom).set({
    deck: deck,
    players: [{ id: myId, name }],
    turn: 0,
    direction: 1,
    discard: startCard,
    hands: { [myId]: initialHand }
  }).then(() => launchArena());
}

function connectRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  const name = document.getElementById('playerName').value.trim() || 'Joueur';
  if(!code) return alert("Rentre un code valide.");

  const ref = db.collection('rooms').doc(code);
  ref.get().then(doc => {
    if(!doc.exists) return alert("Table introuvable !");
    let d = doc.data();
    let players = d.players || [];
    if(players.length >= 4 && !players.find(p=>p.id===myId)) return alert("Table pleine !");

    let deck = d.deck || buildOfficialDeck();
    let hands = d.hands || {};

    if(!players.find(p=>p.id===myId)) {
      players.push({ id: myId, name });
      hands[myId] = deck.splice(0, 7);
    }

    ref.update({ players, hands, deck }).then(() => {
      currentRoom = code; launchArena();
    });
  });
}

function launchArena() {
  document.getElementById('lobbyPanel').classList.add('hidden');
  document.getElementById('gameArena').classList.remove('hidden');
  document.getElementById('badgeRoom').textContent = "TABLE : " + currentRoom;

  if(unsub) unsub();
  unsub = db.collection('rooms').doc(currentRoom).onSnapshot(snap => {
    if(snap.exists) updateUi(snap.data());
  });
}

function updateUi(d) {
  d.players.forEach((p, idx) => {
    let lbl = document.getElementById('lbl' + idx);
    if(lbl) lbl.textContent = p.name + (p.id === myId ? ' (Toi)' : '');
    let slot = document.getElementById('slot' + idx);
    if(slot) slot.classList.toggle('active', d.turn === idx);
  });

  let pile = document.getElementById('tablePile');
  pile.className = 'uno-card ' + d.discard.color;
  pile.textContent = d.discard.val;

  let handBox = document.getElementById('handBox'); handBox.innerHTML = '';
  (d.hands[myId] || []).forEach((cData, i) => {
    let c = document.createElement('div');
    c.className = 'uno-card ' + cData.color;
    c.textContent = cData.val;
    c.onclick = () => playCard(cData, i, d);
    handBox.appendChild(c);
  });
}

function getNextTurn(currentTurn, direction, totalPlayers, skip = false) {
  let step = skip ? 2 * direction : direction;
  let next = (currentTurn + step) % totalPlayers;
  if(next < 0) next += totalPlayers;
  return next;
}

function playCard(card, idx, d) {
  let pIdx = d.players.findIndex(p => p.id === myId);
  if(d.turn !== pIdx) return alert("Ce n'est pas ton tour !");

  if(card.color === 'wild') {
    pendingCard = { card, idx, d };
    document.getElementById('colorPicker').classList.remove('hidden');
    return;
  }

  if(card.color === d.discard.color || card.val === d.discard.val) {
    executeMove(card, idx, d, card.color);
  } else {
    alert("Carte incompatible !");
  }
}

function chooseColor(color) {
  document.getElementById('colorPicker').classList.add('hidden');
  if(pendingCard) {
    executeMove(pendingCard.card, pendingCard.idx, pendingCard.d, color);
    pendingCard = null;
  }
}

/* EXECUTION ET ATTAQUE DIRECTE DES CARTES SPECIALES (+2 ET +4) */
function executeMove(card, idx, d, targetColor) {
  let deck = [...(d.deck || [])];
  let hands = { ...d.hands };
  let myHand = [...hands[myId]];
  myHand.splice(idx, 1);
  hands[myId] = myHand;

  let direction = d.direction || 1;
  let skip = false;

  if(card.val === '🔄') direction *= -1;
  if(card.val === '🚫') skip = true;

  let nextTurn = getNextTurn(d.turn, direction, d.players.length, skip);

  // DISTRIBUTION IMMÉDIATE DE 2 CARTES ET SAUT DU TOUR
  if(card.val === '+2') {
    let victimId = d.players[nextTurn].id;
    let victimHand = [...(hands[victimId] || [])];
    for(let i=0; i<2; i++) {
      if(deck.length === 0) deck = buildOfficialDeck();
      victimHand.push(deck.pop());
    }
    hands[victimId] = victimHand;
    nextTurn = getNextTurn(nextTurn, direction, d.players.length, false);
  }

  // DISTRIBUTION IMMÉDIATE DE 4 CARTES ET SAUT DU TOUR
  if(card.val === '🌈 +4') {
    let victimId = d.players[nextTurn].id;
    let victimHand = [...(hands[victimId] || [])];
    for(let i=0; i<4; i++) {
      if(deck.length === 0) deck = buildOfficialDeck();
      victimHand.push(deck.pop());
    }
    hands[victimId] = victimHand;
    nextTurn = getNextTurn(nextTurn, direction, d.players.length, false);
  }

  db.collection('rooms').doc(currentRoom).update({
    discard: { color: targetColor, val: card.val },
    hands: hands,
    deck: deck,
    turn: nextTurn,
    direction: direction
  });
}

function drawUnoCard() {
  db.collection('rooms').doc(currentRoom).get().then(doc => {
    let d = doc.data();
    let pIdx = d.players.findIndex(p => p.id === myId);
    if(d.turn !== pIdx) return alert("Ce n'est pas ton tour !");

    let deck = [...(d.deck || [])];
    if(deck.length === 0) deck = buildOfficialDeck();

    let newCard = deck.pop();
    let newHand = [...(d.hands[myId] || []), newCard];

    let nextTurn = getNextTurn(d.turn, d.direction || 1, d.players.length, false);

    db.collection('rooms').doc(currentRoom).update({
      deck: deck,
      [`hands.${myId}`]: newHand,
      turn: nextTurn
    });
  });
}

function shoutUno() { alert("📣 UNO !!"); }
</script>
</body>
</html>
