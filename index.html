<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jeux entre frères 🎮</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg-dark: #0b0d19;
    --card-bg: rgba(23, 27, 52, 0.7);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f8f9ff;
    --muted: #a0a7d0;
    --accent: #7c5cff;
    --accent-glow: rgba(124, 92, 255, 0.4);
    --accent2: #ff5c8a;
    --accent2-glow: rgba(255, 92, 138, 0.4);
    --green: #3ddc97;
    --yellow: #ffd23f;
    --radius: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* ================= ARRIÈRE-PLAN ANIMÉ ================= */
  .bg-animation {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #12162d 0%, #080911 100%);
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    animation: float 18s infinite ease-in-out alternate;
  }

  .orb-1 { width: 350px; height: 350px; background: #7c5cff; top: -50px; left: -50px; }
  .orb-2 { width: 400px; height: 400px; background: #ff5c8a; bottom: -100px; right: -50px; animation-delay: -5s; }
  .orb-3 { width: 300px; height: 300px; background: #00d2ff; top: 40%; left: 60%; animation-delay: -10s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 80px) scale(1.15); }
    100% { transform: translate(-40px, 40px) scale(0.9); }
  }

  /* ================= GLASSMORPHISM CARD ================= */
  h1 {
    font-size: 2rem; font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--muted));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px; text-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; text-align: center; }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px; width: 100%; max-width: 480px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ================= BOUTONS ET INPUTS ================= */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #5a38ff);
    color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
    margin-top: 12px; box-shadow: 0 8px 20px var(--accent-glow);
    transition: all 0.2s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text); box-shadow: none; }
  .btn.pink { background: linear-gradient(135deg, var(--accent2), #e03063); box-shadow: 0 8px 20px var(--accent2-glow); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--card-border); background: rgba(0, 0, 0, 0.3);
    color: var(--text); font-size: 1rem; outline: none; margin-top: 8px;
  }

  /* ================= SALON MULTI-JOUEURS (JUSQU'À 4) ================= */
  .games-pick { display: grid; gap: 10px; margin-top: 12px; }
  .game-opt {
    padding: 14px; border-radius: 14px; border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03); cursor: pointer; font-weight: 600; transition: all 0.2s ease;
  }
  .game-opt.selected { border-color: var(--accent); background: rgba(124, 92, 255, 0.25); }

  .player-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .player-tag {
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
    padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; text-align: center;
  }

  .roomcode {
    font-size: 1.8rem; letter-spacing: 6px; font-weight: 900; text-align: center;
    background: rgba(0, 0, 0, 0.3); border: 1px dashed var(--accent); border-radius: 14px;
    padding: 10px; margin: 12px 0; text-shadow: 0 0 10px var(--accent-glow);
  }

  .status { margin: 12px 0; font-size: 1.05rem; font-weight: 700; text-align: center; min-height: 26px; color: var(--yellow); }

  /* ================= JEUX ================= */
  .game-grid { display: grid; gap: 8px; margin: 16px auto; justify-content: center; }
  .cell {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.05); border-radius: 12px;
    font-weight: 800; cursor: pointer; user-select: none; border: 1px solid var(--card-border);
  }

  #xoBoard { grid-template-columns: repeat(3, 75px); }
  #xoBoard .cell { width: 75px; height: 75px; font-size: 2rem; }

  #p4Board { grid-template-columns: repeat(7, 40px); gap: 6px; }
  #p4Board .cell { width: 40px; height: 40px; border-radius: 50%; }
  #p4Cols { display: grid; grid-template-columns: repeat(7, 40px); gap: 6px; margin-top: 8px; }
  #p4Cols button { width: 40px; height: 32px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-weight: 800; }

  .choice-row { display: flex; gap: 10px; margin-top: 12px; }
  .choice-btn { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); background: rgba(255, 255, 255, 0.05); font-size: 1.8rem; cursor: pointer; }

  /* PETIT BAC UI */
  .bac-letter { font-size: 2.5rem; font-weight: 900; text-align: center; color: var(--accent2); margin-bottom: 12px; }
  .bac-field { margin-bottom: 10px; }
  .bac-field label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }

  .hidden { display: none !important; }
  .backlink { color: var(--muted); text-align: center; margin-top: 16px; cursor: pointer; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="bg-animation">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<h1>🎮 Jeux entre frères</h1>
<p class="subtitle">Jusqu'à 4 joueurs en ligne dans le même salon !</p>

<!-- ACCUEIL -->
<div class="card" id="screenHome">
  <label style="font-size:0.85rem; color:var(--muted);">Ton Pseudo :</label>
  <input type="text" id="playerNameInput" placeholder="Ex: Joueur 1" maxlength="12" />

  <button class="btn" id="btnShowCreate" style="margin-top:16px;">➕ Créer un salon (1 à 4 joueurs)</button>
  <button class="btn secondary" id="btnShowJoin">🔗 Rejoindre un salon</button>

  <div id="createBox" class="hidden">
    <p style="margin-top:16px; font-weight:600; color:var(--muted);">Choisis un jeu :</p>
    <div class="games-pick">
      <div class="game-opt" data-game="bac">📝 Petit Bac (1-4 Joueurs)</div>
      <div class="game-opt" data-game="xo">⭕❌ Morpion (2 Joueurs)</div>
      <div class="game-opt" data-game="p4">🔴🟡 Puissance 4 (2 Joueurs)</div>
      <div class="game-opt" data-game="rps">✊✋✌️ Pierre-Feuille-Ciseaux (2 Joueurs)</div>
    </div>
    <button class="btn pink" id="btnCreateGo" disabled>Lancer le salon</button>
  </div>

  <div id="joinBox" class="hidden">
    <p style="margin-top:16px; font-weight:600; color:var(--muted);">Code du salon :</p>
    <input type="text" id="joinCodeInput" maxlength="6" placeholder="EX: 7F3K2A" style="text-align:center; letter-spacing:3px; text-transform:uppercase;" />
    <button class="btn pink" id="btnJoinGo">Rejoindre le salon</button>
  </div>
</div>

<!-- SALON / JEU -->
<div class="card hidden" id="screenGame">
  <div class="roomcode" id="roomCodeDisplay"></div>
  <div class="player-list" id="playerList"></div>
  <div class="status" id="statusText">Connexion...</div>

  <!-- JEU MORPION -->
  <div id="xoBoard" class="game-grid hidden"></div>

  <!-- JEU PUISSANCE 4 -->
  <div id="p4Wrap" class="hidden">
    <div id="p4Cols"></div>
    <div id="p4Board" class="game-grid"></div>
  </div>

  <!-- JEU PIERRE FEUILLE CISEAUX -->
  <div id="rpsWrap" class="hidden">
    <div class="choice-row">
      <button class="choice-btn" data-c="rock">✊</button>
      <button class="choice-btn" data-c="paper">✋</button>
      <button class="choice-btn" data-c="scissors">✌️</button>
    </div>
  </div>

  <!-- JEU PETIT BAC -->
  <div id="bacWrap" class="hidden">
    <div class="bac-letter" id="bacLetter">-</div>
    <div class="bac-field">
      <label>Prénom :</label>
      <input type="text" id="bacName" />
    </div>
    <div class="bac-field">
      <label>Pays / Ville :</label>
      <input type="text" id="bacCountry" />
    </div>
    <div class="bac-field">
      <label>Animal :</label>
      <input type="text" id="bacAnimal" />
    </div>
    <button class="btn pink" id="btnSubmitBac">STOP ! Valider mes réponses</button>
  </div>

  <button class="btn secondary hidden" id="btnRestart">🔄 Rejouer une partie</button>
  <div class="backlink" id="btnLeave">← Quitter le salon</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1MOyaEvL5PjjtHrbaPpRkZfIy_oXO2e8",
  authDomain: "jeu-entre-freres.firebaseapp.com",
  projectId: "jeu-entre-freres",
  storageBucket: "jeu-entre-freres.firebasestorage.app",
  messagingSenderId: "360129773422",
  appId: "1:360129773422:web:e8c7386b0dffd5d38acb7f",
  measurementId: "G-3RY3JJPYR4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({ experimentalForceLongPolling: true });

let playerId = localStorage.getItem('ffg_pid');
if(!playerId){ playerId = 'p_' + Math.random().toString(36).slice(2,10); localStorage.setItem('ffg_pid', playerId); }

let roomCode = null, unsub = null, selectedGame = null, myName = "Joueur";

const $ = id => document.getElementById(id);

function initDOM() {
  const xoBox = $('xoBoard'); xoBox.innerHTML = '';
  for(let i=0; i<9; i++){
    const c = document.createElement('div'); c.className = 'cell'; c.dataset.idx = i; xoBox.appendChild(c);
  }
  const p4Cols = $('p4Cols'); p4Cols.innerHTML = '';
  for(let c=0; c<7; c++){
    const btn = document.createElement('button'); btn.textContent = '↓'; btn.dataset.col = c; p4Cols.appendChild(btn);
  }
  const p4Board = $('p4Board'); p4Board.innerHTML = '';
  for(let i=0; i<42; i++){
    const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.idx = i; p4Board.appendChild(cell);
  }
}
initDOM();

$('btnShowCreate').onclick = () => {$('createBox').classList.remove('hidden'); $('joinBox').classList.add('hidden'); };$('btnShowJoin').onclick = () => { $('joinBox').classList.remove('hidden');$('createBox').classList.add('hidden'); };

document.querySelectorAll('.game-opt').forEach(el=>{
  el.onclick = () => {
    document.querySelectorAll('.game-opt').forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    selectedGame = el.dataset.game;
    $('btnCreateGo').disabled = false;
  };
});

function genCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

$('btnCreateGo').onclick = async () => {
  myName = $('playerNameInput').value.trim() || "Joueur 1";
  roomCode = genCode();
  const alphabet = "ABCDEFGHIJKLMNOPRSTV";
  const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

  const data = {
    game: selectedGame,
    status: 'waiting',
    playerOrder: [playerId],
    players: {
      [playerId]: { name: myName, score: 0 }
    },
    turn: playerId,
    board: selectedGame==='xo'? Array(9).fill(null) : selectedGame==='p4'? Array(42).fill(null) : null,
    choices: {},
    bacLetter: randomLetter,
    bacSubmits: {},
    winner: null
  };
  await db.collection('rooms').doc(roomCode).set(data);
  enterRoom(roomCode);
};

$('btnJoinGo').onclick = async () => {
  myName = $('playerNameInput').value.trim() || "Joueur";
  const code = $('joinCodeInput').value.trim().toUpperCase();
  if(code.length < 4) return alert('Code invalide.');
  const ref = db.collection('rooms').doc(code);

  try {
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      if(!doc.exists) throw new Error('notfound');
      const d = doc.data();
      if(d.playerOrder.length >= 4 && !d.playerOrder.includes(playerId)) throw new Error('full');
      
      let playerOrder = d.playerOrder;
      if(!playerOrder.includes(playerId)) playerOrder.push(playerId);

      let players = d.players || {};
      players[playerId] = { name: myName, score: 0 };

      tx.update(ref, { playerOrder, players, status: playerOrder.length > 1 ? 'playing' : 'waiting' });
    });
  } catch(e) {
    if(e.message==='notfound') return alert("Salon introuvable.");
    if(e.message==='full') return alert("Salon plein (4 joueurs max).");
    return alert('Erreur : ' + e.message);
  }
  roomCode = code;
  enterRoom(roomCode);
};

function enterRoom(code){
  $('screenHome').classList.add('hidden');
  $('screenGame').classList.remove('hidden');$('roomCodeDisplay').textContent = code;
  if(unsub) unsub();
  unsub = db.collection('rooms').doc(code).onSnapshot(snap=>{
    if(!snap.exists) return;
    render(snap.data());
  });
}

$('btnLeave').onclick = () => {
  if(unsub) unsub();
  $('screenGame').classList.add('hidden');$('screenHome').classList.remove('hidden');
  ['xoBoard','p4Wrap','rpsWrap','bacWrap'].forEach(id=>$(id).classList.add('hidden'));
};

function render(d){
  // Liste des joueurs
  const plist = $('playerList'); plist.innerHTML = '';
  d.playerOrder.forEach((pid, idx)=>{
    const tag = document.createElement('div'); tag.className = 'player-tag';
    const p = d.players[pid] || {};
    tag.textContent = `${p.name || 'Joueur'} ${pid===playerId?'(Toi)':''}`;
    if(d.turn === pid) tag.style.borderColor = 'var(--accent)';
    plist.appendChild(tag);
  });

  ['xoBoard','p4Wrap','rpsWrap','bacWrap'].forEach(id=>$(id).classList.add('hidden'));$('btnRestart').classList.toggle('hidden', d.status!=='finished');

  if(d.status === 'waiting'){
    $('statusText').textContent = "En attente d'autres joueurs...";
  } else if(d.status === 'finished'){
    $('statusText').textContent = d.winner === 'draw' ? 'Égalité ! 🤝' : `Partie terminée ! 🏆`;
  } else {
    $('statusText').textContent = d.turn === playerId ? "⚡ À ton tour !" : `Tour de : ${d.players[d.turn]?.name || 'un joueur'}`;
  }

  if(d.game==='xo') renderXO(d);
  else if(d.game==='p4') renderP4(d);
  else if(d.game==='rps') renderRPS(d);
  else if(d.game==='bac') renderBac(d);
}

/* MORPION */
function renderXO(d){
  const box = $('xoBoard'); box.classList.remove('hidden');
  const cells = box.children;
  d.board.forEach((val, i)=>{
    const c = cells[i]; c.textContent = val || '';
    c.onclick = () => {
      if(d.status==='finished' || d.turn!==playerId || d.board[i]) return;
      const nextTurn = d.playerOrder.find(id => id !== playerId) || playerId;
      const board = [...d.board]; board[i] = playerId === d.playerOrder[0] ? 'X' : 'O';
      db.collection('rooms').doc(roomCode).update({ board, turn: nextTurn });
    };
  });
}

/* PUISSANCE 4 */
function renderP4(d){
  $('p4Wrap').classList.remove('hidden');
  const cols = $('p4Cols').children;
  for(let c=0; c<7; c++){
    cols[c].disabled = d.status==='finished' || d.turn!==playerId;
    cols[c].onclick = () => {
      const board = [...d.board];
      let row = -1;
      for(let r=5; r>=0; r--){ if(!board[r*7+c]){ row=r; break; } }
      if(row === -1) return;
      board[row*7+c] = playerId === d.playerOrder[0] ? 'X' : 'O';
      const nextTurn = d.playerOrder.find(id => id !== playerId) || playerId;
      db.collection('rooms').doc(roomCode).update({ board, turn: nextTurn });
    };
  }
  const cells = $('p4Board').children;
  d.board.forEach((v, i)=>{
    cells[i].style.background = v==='X' ? 'var(--accent2)' : v==='O' ? 'var(--yellow)' : 'rgba(255,255,255,0.05)';
  });
}

/* PIERRE FEUILLE CISEAUX */
function renderRPS(d){
  $('rpsWrap').classList.remove('hidden');
  document.querySelectorAll('#rpsWrap .choice-btn').forEach(b=>{
    b.disabled = d.status==='finished' || !!d.choices[playerId];
    b.onclick = () => {
      db.collection('rooms').doc(roomCode).update({ [`choices.${playerId}`]: b.dataset.c });
    };
  });
}

/* PETIT BAC */
function renderBac(d){
  $('bacWrap').classList.remove('hidden');
  $('bacLetter').textContent = d.bacLetter \vert{}\vert{} 'A';$('btnSubmitBac').disabled = !!d.bacSubmits?.[playerId];

  $('btnSubmitBac').onclick = () => {
    const resp = {
      name: $('bacName').value.trim(),
      country: $('bacCountry').value.trim(),
      animal: $('bacAnimal').value.trim()
    };
    db.collection('rooms').doc(roomCode).update({
      [`bacSubmits.${playerId}`]: resp,
      status: 'finished'
    });
  };
}

/* REJOUER */
$('btnRestart').onclick = () => {
  const alphabet = "ABCDEFGHIJKLMNOPRSTV";
  const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
  db.collection('rooms').doc(roomCode).update({
    board: Array(42).fill(null), status:'playing', choices:{}, bacSubmits:{}, bacLetter: randomLetter
  });
};
</script>
</body>
</html>
