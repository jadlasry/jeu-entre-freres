<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jeux entre frères 🎮</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#0f1224; --bg2:#171b34; --card:#1d2140; --text:#f2f3ff;
    --muted:#9aa0c3; --accent:#7c5cff; --accent2:#ff5c8a;
    --green:#3ddc97; --border:#2c3160; --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f3f4fb; --bg2:#ffffff; --card:#ffffff; --text:#1a1c2e;
      --muted:#666c8f; --border:#e3e5f5;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 48px;
  }
  h1{font-size:1.5rem; margin:8px 0 4px;}
  .subtitle{color:var(--muted); margin-bottom:24px; text-align:center;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; width:100%; max-width:460px; box-shadow:0 10px 30px rgba(0,0,0,.15);
  }
  .btn{
    display:block; width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:1rem; font-weight:600;
    cursor:pointer; margin-top:12px; transition:transform .1s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.pink{background:var(--accent2);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  input[type=text]{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:1rem; text-align:center;
    letter-spacing:3px; text-transform:uppercase;
  }
  .game-grid{display:grid; gap:10px; margin:16px auto;}
  .choice-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .choice-btn{flex:1; min-width:80px; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:1.6rem; cursor:pointer;}
  .choice-btn:hover{border-color:var(--accent);}
  .cell{
    display:flex; align-items:center; justify-content:center;
    background:var(--bg2); border-radius:10px; font-weight:800; cursor:pointer;
    user-select:none; border:1px solid var(--border); transition: background 0.15s ease;
  }
  #xoBoard{grid-template-columns:repeat(3,72px);}
  #xoBoard .cell{width:72px; height:72px; font-size:2rem;}
  #p4Board{grid-template-columns:repeat(7,44px); gap:6px;}
  #p4Board .cell{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:default;}
  #p4Cols{display:grid; grid-template-columns:repeat(7,44px); gap:6px; margin-top:8px;}
  #p4Cols button{width:44px; height:32px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; font-weight:700;}
  .status{margin:14px 0; font-weight:600; text-align:center; min-height:24px;}
  .roomcode{
    font-size:1.6rem; letter-spacing:6px; font-weight:800; text-align:center;
    background:var(--bg2); border:1px dashed var(--accent); border-radius:12px; padding:10px; margin:12px 0;
  }
  .players{display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:8px;}
  .players b{color:var(--text);}
  .hidden{display:none !important;}
  .games-pick{display:grid; gap:10px; margin-top:8px;}
  .game-opt{padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--bg2); cursor:pointer; text-align:left;}
  .game-opt.selected{border-color:var(--accent); background:rgba(124,92,255,.15);}
  .backlink{color:var(--muted); text-align:center; margin-top:14px; cursor:pointer; font-size:.9rem;}
  .score{text-align:center; font-size:1.1rem; margin-top:6px;}
</style>
</head>
<body>

<h1>🎮 Jeux entre frères</h1>
<p class="subtitle">Joue en ligne à distance : crée une partie, envoie le code à ton frère.</p>

<!-- ÉCRAN ACCUEIL -->
<div class="card" id="screenHome">
  <button class="btn" id="btnShowCreate">➕ Créer une partie</button>
  <button class="btn secondary" id="btnShowJoin">🔗 Rejoindre une partie</button>

  <div id="createBox" class="hidden">
    <p style="margin-top:18px; font-weight:600;">Choisis un jeu :</p>
    <div class="games-pick">
      <div class="game-opt" data-game="xo">⭕❌ Morpion (XO)</div>
      <div class="game-opt" data-game="p4">🔴🟡 Puissance 4</div>
      <div class="game-opt" data-game="rps">✊✋✌️ Pierre-Feuille-Ciseaux</div>
    </div>
    <button class="btn pink" id="btnCreateGo" disabled>Créer la partie</button>
  </div>

  <div id="joinBox" class="hidden">
    <p style="margin-top:18px; font-weight:600;">Code reçu de ton frère :</p>
    <input type="text" id="joinCodeInput" maxlength="6" placeholder="EX: 7F3K2A" />
    <button class="btn pink" id="btnJoinGo">Rejoindre</button>
  </div>
</div>

<!-- ÉCRAN SALLE / JEU -->
<div class="card hidden" id="screenGame">
  <div class="roomcode" id="roomCodeDisplay"></div>
  <div class="players">
    <span>Joueur 1: <b id="p1Name">—</b></span>
    <span>Joueur 2: <b id="p2Name">—</b></span>
  </div>
  <div class="status" id="statusText">En attente...</div>

  <div id="xoBoard" class="game-grid hidden"></div>

  <div id="p4Wrap" class="hidden">
    <div id="p4Cols"></div>
    <div id="p4Board" class="game-grid"></div>
  </div>

  <div id="rpsWrap" class="hidden">
    <div class="score" id="rpsScore">0 - 0</div>
    <div class="choice-row">
      <button class="choice-btn" data-c="rock">✊</button>
      <button class="choice-btn" data-c="paper">✋</button>
      <button class="choice-btn" data-c="scissors">✌️</button>
    </div>
  </div>

  <button class="btn secondary hidden" id="btnRestart">🔄 Rejouer</button>
  <div class="backlink" id="btnLeave">← Quitter</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1MOyaEvL5PjjtHrbaPpRkZfIy_oXO2e8",
  authDomain: "jeu-entre-freres.firebaseapp.com",
  projectId: "jeu-entre-freres",
  storageBucket: "jeu-entre-freres.firebasestorage.app",
  messagingSenderId: "360129773422",
  appId: "1:360129773422:web:e8c7386b0dffd5d38acb7f",
  measurementId: "G-3RY3JJPYR4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Activation de la persistance locale pour accélérer les réponses réseau
db.settings({ experimentalForceLongPolling: true });

let playerId = localStorage.getItem('ffg_pid');
if(!playerId){ playerId = 'p_' + Math.random().toString(36).slice(2,10); localStorage.setItem('ffg_pid', playerId); }

let roomCode = null, mySlot = null, unsub = null, selectedGame = null;

const $ = id => document.getElementById(id);
const screenHome = $('screenHome'), screenGame =$('screenGame');

// Initialisation des grilles fixes pour éviter de recréer le DOM inutilement
function initDOMBoards() {
  const xoBox = $('xoBoard'); xoBox.innerHTML = '';
  for(let i=0; i<9; i++){
    const c = document.createElement('div');
    c.className = 'cell'; c.dataset.idx = i;
    xoBox.appendChild(c);
  }

  const p4Cols = $('p4Cols'); p4Cols.innerHTML = '';
  for(let c=0; c<7; c++){
    const btn = document.createElement('button'); btn.textContent = '↓';
    btn.dataset.col = c;
    p4Cols.appendChild(btn);
  }

  const p4Board = $('p4Board'); p4Board.innerHTML = '';
  for(let i=0; i<42; i++){
    const cell = document.createElement('div'); cell.className = 'cell';
    c.dataset.idx = i;
    p4Board.appendChild(cell);
  }
}
initDOMBoards();

$('btnShowCreate').onclick = () => {$('createBox').classList.remove('hidden'); $('joinBox').classList.add('hidden'); };$('btnShowJoin').onclick = () => { $('joinBox').classList.remove('hidden');$('createBox').classList.add('hidden'); };

document.querySelectorAll('.game-opt').forEach(el=>{
  el.onclick = () => {
    document.querySelectorAll('.game-opt').forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    selectedGame = el.dataset.game;
    $('btnCreateGo').disabled = false;
  };
});

function genCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function emptyBoard(game){
  if(game==='xo') return Array(9).fill(null);
  if(game==='p4') return Array(42).fill(null);
  return null;
}

$('btnCreateGo').onclick = async () => {
  roomCode = genCode();
  const data = {
    game: selectedGame,
    status: 'waiting',
    players: { X: { id: playerId }, O: null },
    turn: 'X',
    board: emptyBoard(selectedGame),
    choices: { X: null, O: null },
    scores: { X: 0, O: 0 },
    winner: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  await db.collection('rooms').doc(roomCode).set(data);
  mySlot = 'X';
  enterRoom(roomCode);
};

$('btnJoinGo').onclick = async () => {
  const code = $('joinCodeInput').value.trim().toUpperCase();
  if(code.length < 4) return alert('Entre le code complet reçu de ton frère.');
  const ref = db.collection('rooms').doc(code);
  try{
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      if(!doc.exists) throw new Error('notfound');
      const d = doc.data();
      if(d.players.X && d.players.X.id === playerId){ mySlot='X'; return; }
      if(d.players.O && d.players.O.id === playerId){ mySlot='O'; return; }
      if(!d.players.X){ tx.update(ref, {'players.X': {id: playerId}}); mySlot='X'; return; }
      if(!d.players.O){ tx.update(ref, {'players.O': {id: playerId}, status:'playing'}); mySlot='O'; return; }
      throw new Error('full');
    });
  }catch(e){
    if(e.message==='notfound') return alert("Ce code n'existe pas.");
    if(e.message==='full') return alert('Cette partie a déjà 2 joueurs.');
    return alert('Erreur : ' + e.message);
  }
  roomCode = code;
  enterRoom(roomCode);
};

function enterRoom(code){
  screenHome.classList.add('hidden');
  screenGame.classList.remove('hidden');
  $('roomCodeDisplay').textContent = code;
  if(unsub) unsub();
  unsub = db.collection('rooms').doc(code).onSnapshot(snap=>{
    if(!snap.exists) return;
    render(snap.data());
  }, err => { $('statusText').textContent = 'Connexion perdue.'; });
}

$('btnLeave').onclick = () => {
  if(unsub) unsub();
  screenGame.classList.add('hidden');
  screenHome.classList.remove('hidden');
  ['xoBoard','p4Wrap','rpsWrap'].forEach(id=>$(id).classList.add('hidden'));
};

function render(d){
  $('p1Name').textContent = d.players.X ? (d.players.X.id===playerId?'Toi':'Frère') : '—';
  $('p2Name').textContent = d.players.O ? (d.players.O.id===playerId?'Toi':'Frère') : '—';

  ['xoBoard','p4Wrap','rpsWrap'].forEach(id=>$(id).classList.add('hidden'));$('btnRestart').classList.toggle('hidden', d.status!=='finished');

  if(!d.players.O){
    $('statusText').textContent = "En attente que ton frère rejoigne avec le code...";
  } else if(d.status==='finished'){
    if(d.game==='rps'){
      $('statusText').textContent = d.winner==='draw' ? 'Match nul final !' : (d.winner===mySlot?'Tu as gagné le match ! 🏆':'Ton frère a gagné le match.');
    } else {
      $('statusText').textContent = d.winner==='draw' ? 'Match nul !' : (d.winner===mySlot?'Tu as gagné ! 🎉':'Ton frère a gagné.');
    }
  } else {
    if(d.game==='rps'){
      $('statusText').textContent = 'Fais ton choix pour ce round...';
    } else {
      $('statusText').textContent = d.turn===mySlot ? 'À toi de jouer !' : "Tour de ton frère...";
    }
  }

  if(d.game==='xo') renderXO(d);
  else if(d.game==='p4') renderP4(d);
  else if(d.game==='rps') renderRPS(d);
}

/* ---------- MORPION (XO) FLUIDIFIÉ ---------- */
function renderXO(d){
  const box = $('xoBoard'); box.classList.remove('hidden');
  const cells = box.children;
  d.board.forEach((val, i)=>{
    const c = cells[i];
    c.textContent = val || '';
    c.onclick = () => xoPlay(i, d);
  });
}
const XO_WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoCheckWin(b){
  for(const [a,b2,c] of XO_WINS) if(b[a] && b[a]===b[b2] && b[a]===b[c]) return b[a];
  if(b.every(x=>x)) return 'draw';
  return null;
}
function xoPlay(i,d){
  if(d.status==='finished' || d.turn!==mySlot || d.board[i]) return;
  const board = [...d.board]; board[i] = mySlot;
  const w = xoCheckWin(board);
  db.collection('rooms').doc(roomCode).update({
    board, turn: mySlot==='X'?'O':'X',
    status: w ? 'finished':'playing',
    winner: w==='draw' ? 'draw' : (w||null)
  });
}

/* ---------- PUISSANCE 4 FLUIDIFIÉ ---------- */
function renderP4(d){
  $('p4Wrap').classList.remove('hidden');
  const cols = $('p4Cols').children;
  for(let c=0; c<7; c++){
    cols[c].disabled = d.status==='finished' || d.turn!==mySlot;
    cols[c].onclick = () => p4Play(c, d);
  }
  const cells = $('p4Board').children;
  d.board.forEach((v, i)=>{
    cells[i].style.background = v==='X' ? 'var(--accent2)' : v==='O' ? '#ffd23f' : 'var(--bg2)';
  });
}
function p4CheckWin(b){
  const at=(r,c)=> (r<0||r>5||c<0||c>6) ? null : b[r*7+c];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<6;r++) for(let c=0;c<7;c++){
    const v = at(r,c); if(!v) continue;
    for(const [dr,dc] of dirs){
      let count=1;
      for(let k=1;k<4;k++) if(at(r+dr*k,c+dc*k)===v) count++; else break;
      if(count>=4) return v;
    }
  }
  if(b.every(x=>x)) return 'draw';
  return null;
}
function p4Play(col,d){
  if(d.status==='finished' || d.turn!==mySlot) return;
  const board=[...d.board];
  let row=-1;
  for(let r=5;r>=0;r--){ if(!board[r*7+col]){ row=r; break; } }
  if(row===-1) return;
  board[row*7+col]=mySlot;
  const w = p4CheckWin(board);
  db.collection('rooms').doc(roomCode).update({
    board, turn: mySlot==='X'?'O':'X',
    status: w?'finished':'playing',
    winner: w==='draw'?'draw':(w||null)
  });
}

/* ---------- PIERRE-FEUILLE-CISEAUX FLUIDIFIÉ ---------- */
function renderRPS(d){
  $('rpsWrap').classList.remove('hidden');$('rpsScore').textContent = `${d.scores.X} - ${d.scores.O}`;
  document.querySelectorAll('#rpsWrap .choice-btn').forEach(b=>{
    b.disabled = d.status==='finished' || !!(d.choices && d.choices[mySlot]);
    b.onclick = () => rpsPlay(b.dataset.c, d);
  });
}
function rpsWinner(a,b){
  if(a===b) return 'draw';
  const beats = {rock:'scissors', paper:'rock', scissors:'paper'};
  return beats[a]===b ? 'X_beats' : 'O_beats';
}
function rpsPlay(choice, d){
  if(d.status==='finished' || (d.choices && d.choices[mySlot])) return;
  const ref = db.collection('rooms').doc(roomCode);
  
  const choices = {...(d.choices || {}), [mySlot]: choice};
  let updateData = { [`choices.${mySlot}`]: choice };

  if(choices.X && choices.O){
    const res = rpsWinner(choices.X, choices.O);
    let scores = {...d.scores};
    if(res==='X_beats') scores.X++; else if(res==='O_beats') scores.O++;
    const finished = scores.X>=3 || scores.O>=3;
    
    updateData.scores = scores;
    updateData.choices = {X:null, O:null};
    updateData.status = finished ? 'finished' : 'playing';
    updateData.winner = finished ? (scores.X>scores.O?'X':'O') : null;
  }

  ref.update(updateData);
}

/* ---------- REJOUER ---------- */
$('btnRestart').onclick = () => {
  db.collection('rooms').doc(roomCode).update({
    board: emptyBoard(selectedGame), turn:'X', status:'playing', winner:null,
    choices:{X:null,O:null}, scores:{X:0,O:0}
  });
};
</script>
</body>
</html>
